# Blueprint de deploy do GRUPAMENTO no Render.
# Como usar: Render Dashboard -> New -> Blueprint -> aponte para este repositorio.
services:
  - type: web
    name: grupamento
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grupamento-db
          property: connectionString
      - key: ADMIN_USER
        value: coordenacao
      - key: ADMIN_PASSWORD
        sync: false          # defina o valor no painel do Render
      - key: SESSION_SECRET
        generateValue: true
      - key: RATE_LIMIT_MAX
        value: "5"

databases:
  - name: grupamento-db
    databaseName: grupamento
    plan: free
    region: oregon
